<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Animated Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1">
        <animate attributeName="stop-color" values="#6366f1;#3b82f6;#8b5cf6;#ec4899;#6366f1" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#a855f7">
        <animate attributeName="stop-color" values="#a855f7;#06b6d4;#6366f1;#3b82f6;#a855f7" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#ec4899">
        <animate attributeName="stop-color" values="#ec4899;#8b5cf6;#3b82f6;#06b6d4;#ec4899" dur="10s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>
  </defs>

  <style>
    .title-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 44px;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 19px;
      fill: #94a3b8;
      letter-spacing: 0.2px;
    }
    .badge-pill {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e0e7ff;
      letter-spacing: 0.5px;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="360" rx="16" fill="url(#grid)" />

  <!-- Animated Glowing Atmospheric Orbs -->
  <circle cx="150" cy="80" r="140" fill="#4f46e5" opacity="0.15" filter="url(#glow)">
    <animate attributeName="cx" values="150;180;150" dur="8s" repeatCount="indefinite" />
    <animate attributeName="cy" values="80;110;80" dur="8s" repeatCount="indefinite" />
    <animate attributeName="r" values="140;160;140" dur="8s" repeatCount="indefinite" />
  </circle>
  <circle cx="1050" cy="280" r="160" fill="#ec4899" opacity="0.12" filter="url(#glow)">
    <animate attributeName="cx" values="1050;1020;1050" dur="9s" repeatCount="indefinite" />
    <animate attributeName="cy" values="280;240;280" dur="9s" repeatCount="indefinite" />
  </circle>
  <circle cx="900" cy="90" r="120" fill="#06b6d4" opacity="0.12" filter="url(#glow)">
    <animate attributeName="cy" values="90;130;90" dur="7s" repeatCount="indefinite" />
  </circle>

  <!-- Modern Decorative Border -->
  <rect x="2" y="2" width="1196" height="356" rx="15" fill="none" stroke="url(#accentGrad)" stroke-width="2" opacity="0.4" />

  <!-- Left Icon Group (Learning & Growth Network Graphic) -->
  <g transform="translate(70, 75)">
    <!-- Connected Hexagon Hub -->
    <polygon points="55,10 95,32 95,78 55,100 15,78 15,32" fill="none" stroke="url(#accentGrad)" stroke-width="3">
      <animateTransform attributeName="transform" type="rotate" from="0 55 55" to="360 55 55" dur="30s" repeatCount="indefinite" />
    </polygon>

    <!-- Center Knowledge Node -->
    <circle cx="55" cy="55" r="18" fill="url(#accentGrad)" filter="url(#glow)" />
    
    <!-- Floating Skill Nodes -->
    <circle cx="55" cy="-20" r="8" fill="#38bdf8">
      <animate attributeName="cy" values="-20;-12;-20" dur="3s" repeatCount="indefinite" />
    </circle>
    <line x1="55" y1="10" x2="55" y2="-12" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,3" />

    <circle cx="130" cy="55" r="8" fill="#818cf8">
      <animate attributeName="cx" values="130;122;130" dur="3.5s" repeatCount="indefinite" />
    </circle>
    <line x1="95" y1="55" x2="122" y2="55" stroke="#818cf8" stroke-width="2" stroke-dasharray="3,3" />

    <circle cx="55" cy="130" r="8" fill="#f472b6">
      <animate attributeName="cy" values="130;122;130" dur="4s" repeatCount="indefinite" />
    </circle>
    <line x1="55" y1="100" x2="55" y2="122" stroke="#f472b6" stroke-width="2" stroke-dasharray="3,3" />

    <circle cx="-20" cy="55" r="8" fill="#a78bfa">
      <animate attributeName="cx" values="-20;-12;-20" dur="4.5s" repeatCount="indefinite" />
    </circle>
    <line x1="15" y1="55" x2="-12" stroke="#a78bfa" stroke-width="2" stroke-dasharray="3,3" />
  </g>

  <!-- Central Header Text -->
  <g transform="translate(230, 95)">
    <!-- Category Badge -->
    <rect x="0" y="0" width="310" height="28" rx="14" fill="#312e81" stroke="#6366f1" stroke-width="1.2" />
    <circle cx="14" cy="14" r="5" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="28" y="19" class="badge-pill">CURATED ECOSYSTEM &amp; PLATFORMS</text>

    <!-- Main Title -->
    <text x="0" y="72" class="title-text" fill="url(#accentGrad)">Awesome Corporate Learning Experience</text>

    <!-- Subtitle -->
    <text x="0" y="112" class="subtitle-text">
      The definitive directory of Enterprise LXPs, SaaS Solutions &amp; Open-Source Learning Infrastructure
    </text>

    <!-- Capability Tags / Pills -->
    <g transform="translate(0, 140)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="130" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="65" y="21" class="badge-pill" text-anchor="middle" fill="#cbd5e1">🧠 Skills Graphs</text>

      <!-- Pill 2 -->
      <rect x="142" y="0" width="148" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="216" y="21" class="badge-pill" text-anchor="middle" fill="#cbd5e1">🎯 Personalized Feeds</text>

      <!-- Pill 3 -->
      <rect x="302" y="0" width="124" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="364" y="21" class="badge-pill" text-anchor="middle" fill="#cbd5e1">📊 xAPI &amp; LRS</text>

      <!-- Pill 4 -->
      <rect x="438" y="0" width="144" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="510" y="21" class="badge-pill" text-anchor="middle" fill="#cbd5e1">🤖 AI Tutors &amp; RAG</text>

      <!-- Pill 5 -->
      <rect x="594" y="0" width="158" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="673" y="21" class="badge-pill" text-anchor="middle" fill="#cbd5e1">⚡ Workforce Upskilling</text>
    </g>
  </g>
</svg>
